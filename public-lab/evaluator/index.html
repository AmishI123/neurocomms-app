<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhraseLab semantic review</title><style>body{font:16px/1.6 system-ui;max-width:900px;margin:auto;padding:40px 22px;background:#f7f8f5;color:#18242a}h1{font-size:clamp(2.4rem,7vw,4.5rem);line-height:1}main,.panel{background:#fff;border:1px solid #d7e0d9;border-radius:15px;padding:22px}textarea{width:100%;min-height:210px;box-sizing:border-box;font:13px ui-monospace;padding:12px;border-radius:8px;border:1px solid #b9c9be}button{background:#216b4c;color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:700;margin-top:12px}.panel{margin-top:20px}.score{display:inline-block;margin:5px;padding:8px 12px;background:#eef7f0;border-radius:8px}.bad{color:#9a4d21}</style><p>PHRASELAB / SEMANTIC REVIEW</p><h1>Review annotations locally.</h1><p>Paste one JSON annotation per line using the rubric dimensions. Nothing is uploaded.</p><main><textarea id="input">{"record_id":"demo","reviewer":"you","scores":{"grounding":2,"uncertainty":2,"role_fit":2,"optionality":2,"respect":2},"rationale":"Keeps unknown preferences unknown."}</textarea><button id="run">Validate annotations</button></main><section id="result" class="panel" hidden role="status"></section><script>
const dims=['grounding','uncertainty','role_fit','optionality','respect'];run.onclick=()=>{const rows=input.value.split(/\r?\n/).filter(Boolean).map((x,i)=>{try{return{...JSON.parse(x),line:i+1}}catch{return{line:i+1,error:'invalid JSON'}}});const valid=rows.filter(r=>!r.error&&r.record_id&&r.reviewer&&r.rationale&&r.scores&&dims.every(d=>Number.isInteger(r.scores[d])&&r.scores[d]>=0&&r.scores[d]<=2));const means=Object.fromEntries(dims.map(d=>[d,valid.length?(valid.reduce((n,r)=>n+r.scores[d],0)/valid.length).toFixed(2):'—']));result.hidden=false;result.innerHTML='<h2>'+valid.length+' valid · '+(rows.length-valid.length)+' needing correction</h2><div>'+dims.map(d=>'<span class="score"><strong>'+d+'</strong> '+means[d]+'/2</span>').join('')+'</div><p class="bad">'+rows.filter(r=>!valid.includes(r)).map(r=>'Line '+r.line+' needs review').join('<br>')+'</p><p>These are contextual reviewer judgments, not clinical outcomes.</p>')};
</script>
