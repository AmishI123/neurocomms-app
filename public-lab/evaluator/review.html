<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhraseLab evidence reviewer</title><style>body{font:16px/1.6 system-ui;max-width:980px;margin:auto;padding:36px 22px;background:#f7f8f5;color:#18242a}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:#fff;border:1px solid #d7e0d9;border-radius:15px;padding:20px}pre{white-space:pre-wrap;max-height:330px;overflow:auto;background:#f1f4ef;padding:12px;border-radius:8px}label{display:block;margin:12px 0}select,input,textarea{font:inherit;width:100%;box-sizing:border-box;padding:8px;border:1px solid #b9c9be;border-radius:7px}textarea{min-height:80px}button{background:#216b4c;color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:700;margin:8px 8px 0 0}.muted{color:#66736f}@media(max-width:720px){.layout{grid-template-columns:1fr}}</style><p>PHRASELAB / EVIDENCE REVIEWER</p><h1>Annotate a fictional record.</h1><p class="muted">Ratings stay in this browser until download. Use an assigned reviewer code; do not enter personal information.</p><div class="layout"><section class="panel"><h2 id="title">Loading…</h2><p id="meta"></p><pre id="output"></pre><button id="prev">← Previous</button><button id="next">Next →</button></section><section class="panel"><label>Reviewer code<input id="reviewer" value="reviewer-1"></label><div id="fields"></div><label>Rationale<textarea id="rationale" placeholder="What supports these scores?"></textarea></label><button id="save">Save rating</button><button id="download">Download JSONL</button><p id="status" class="muted" role="status"></p></section></div><script>
const dims=[['grounding','Stays within confirmed facts'],['uncertainty','Preserves unknown information'],['role_fit','Fits the person and activity'],['optionality','Leaves room to accept, edit, decline, or pause'],['respect','Uses concise, respectful wording']];let records=[],i=0,ratings=[];const $=x=>document.querySelector(x);fetch('../museum/catalog.json').then(r=>r.json()).then(x=>{records=x.records;render()}).catch(()=>{$('#title').textContent='Catalog unavailable'});dims.forEach(([id,q])=>{$('#fields').insertAdjacentHTML('beforeend',`<label>${q}<select id="${id}"><option value="0">0 — problematic or absent</option><option value="1" selected>1 — mixed</option><option value="2">2 — clear and supported</option></select></label>`)});function render(){if(!records.length)return;const r=records[i];$('#title').textContent=r.id;$('#meta').textContent=`${i+1} of ${records.length} · ${r.failure}`;$('#output').textContent=r.output;const old=ratings.find(x=>x.record_id===r.id&&x.reviewer===$('#reviewer').value);if(old){dims.forEach(([d])=>$('#'+d).value=old.scores[d]);$('#rationale').value=old.rationale}else{$('#rationale').value='';dims.forEach(([d])=>$('#'+d).value='1')}}$('#prev').onclick=()=>{i=Math.max(0,i-1);render()};$('#next').onclick=()=>{i=Math.min(records.length-1,i+1);render()};$('#save').onclick=()=>{const r=records[i],reviewer=$('#reviewer').value.trim();if(!reviewer){$('#status').textContent='Enter a reviewer code.';return}ratings=ratings.filter(x=>!(x.record_id===r.id&&x.reviewer===reviewer));ratings.push({record_id:r.id,reviewer,scores:Object.fromEntries(dims.map(([d])=>[d,Number($('#'+d).value)])),rationale:$('#rationale').value.trim()});$('#status').textContent=`Saved ${ratings.length} rating${ratings.length===1?'':'s'}.`};$('#download').onclick=()=>{const blob=new Blob([ratings.map(x=>JSON.stringify(x)).join('\n')+'\n'],{type:'application/jsonl'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='phraselab-annotations.jsonl';a.click()};
</script>
