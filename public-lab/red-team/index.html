<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhraseLab · Red-team kit</title><style>body{font:16px/1.6 system-ui;max-width:850px;margin:auto;padding:36px 20px;background:#f7f8f5;color:#18242a}h1{font-size:clamp(2.4rem,7vw,4.5rem);line-height:1}article{background:#fff;border:1px solid #d7e0d9;border-radius:14px;padding:18px;margin:14px 0}.tag{color:#216b4c;font-weight:700}code{background:#edf3ee;padding:2px 5px;border-radius:4px}a{color:#216b4c;font-weight:700}</style><p class="tag">PHRASELAB / RED-TEAM KIT</p><h1>Give the benchmark a harder question.</h1><p>Author fictional cases that test whether a communication tool preserves uncertainty, choice, and respect. Case writing is offline and model-agnostic.</p><div id="cases"></div><p><a href="studio.html">Open the case studio ↗</a> · <a href="examples.json">Download examples</a> · <a href="../atlas/index.html">Open the Live Atlas</a> · <a href="../site/index.html">Platform home</a></p><script>fetch('examples.json').then(r=>r.json()).then(xs=>document.querySelector('#cases').innerHTML=xs.map(x=>`<article><h2>${x.id}</h2><p><span class="tag">${x.domain}</span> · target: <b>${x.target_failure}</b></p><p>${x.activity}</p><details><summary>Facts</summary><ul>${x.facts.map(f=>`<li>${f}</li>`).join('')}</ul></details></article>`).join(''))</script>
