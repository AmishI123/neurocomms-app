<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhraseLab · Case studio</title><style>body{font:16px/1.55 system-ui;max-width:900px;margin:auto;padding:32px 20px;background:#f7f8f5;color:#18242a}h1{font-size:clamp(2.3rem,7vw,4rem);line-height:1;margin:8px 0 14px}.panel{background:#fff;border:1px solid #d7e0d9;border-radius:15px;padding:20px;margin:18px 0}label{display:block;font-weight:700;margin:12px 0 4px}input,textarea{font:inherit;width:100%;padding:9px;border:1px solid #bacbc0;border-radius:8px}textarea{min-height:58px}button{background:#216b4c;color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:700;margin:8px 8px 0 0}button.secondary{background:#5d7068}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.result{border-left:4px solid #216b4c;background:#edf3ee;padding:12px}.bad{border-color:#b06031;background:#fff3ea}.small{color:#5d7068;font-size:.9rem}a{color:#216b4c;font-weight:700}</style><p class="small">PhraseLab / RED-TEAM KIT</p><h1>Case studio</h1><p>Write one fictional case, test six communication cards, and download a JSONL record for the local challenge scorer. Nothing leaves this browser.</p><form id="form" class="panel"><div class="grid"><div><label for="id">Case id</label><input id="id" value="my-fictional-case" pattern="[a-z0-9-]+" required></div><div><label for="domain">Domain</label><input id="domain" value="school" required></div><div><label for="name">Fictional name</label><input id="name" value="Kai" required></div><div><label for="limit">Word limit per card</label><input id="limit" type="number" min="1" max="12" value="6" required></div></div><label for="activity">Activity</label><textarea id="activity" required>Choose between a quiet table and a group table.</textarea><label for="facts">Facts (one per line)</label><textarea id="facts" required>Kai has said quiet spaces can help.
Kai has not said which table is preferred today.</textarea><label>Six optional communication cards</label><div id="cards" class="grid"></div><button type="submit">Check cards</button><button type="button" class="secondary" id="download" disabled>Download submission JSONL</button><button type="button" class="secondary" id="downloadCase" disabled>Download case fixture</button><p id="status" class="result" role="status">Fill in the cards, then check them.</p></form><p><a href="index.html">← Red-team examples</a> · <a href="../challenge/index.html">Challenge scorer</a> · <a href="../atlas/index.html">Live Atlas</a></p><script>const cards=document.querySelector('#cards');for(let i=1;i<=6;i++)cards.insertAdjacentHTML('beforeend',`<div><label for="card${i}">Card ${i}</label><input id="card${i}" placeholder="Optional card"></div>`);let last=null,fixture=null;const form=document.querySelector('#form'),status=document.querySelector('#status'),download=document.querySelector('#download'),downloadCase=document.querySelector('#downloadCase');function value(id){return document.querySelector('#'+id).value.trim()}form.onsubmit=e=>{e.preventDefault();const limit=Number(value('limit')),texts=[...document.querySelectorAll('#cards input')].map(x=>x.value.trim()).filter(Boolean),issues=[],seen=new Set();texts.forEach((x,i)=>{const key=x.toLowerCase();if(seen.has(key))issues.push(`card ${i+1} repeats another card`);seen.add(key);if(x.split(/\s+/).length>limit)issues.push(`card ${i+1} exceeds ${limit} words`)});if(texts.length!==6)issues.push(`add exactly six cards (currently ${texts.length})`);fixture={id:value('id'),domain:value('domain'),profile:{name:value('name')},activity:value('activity'),facts:value('facts').split(/\n/).map(x=>x.trim()).filter(Boolean),target_failure:'author-specified',word_limit:limit};last={case_id:value('id'),condition:'red-team-author',cards:texts};status.className='result '+(issues.length?'bad':'');status.innerHTML=issues.length?'<b>Needs revision</b><br>'+issues.join('<br>'):'<b>Ready for export.</b> Six cards pass deterministic format checks.';download.disabled=Boolean(issues.length);downloadCase.disabled=Boolean(issues.length)};download.onclick=()=>{const blob=new Blob([JSON.stringify(last)+'\n'],{type:'application/jsonl'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=last.case_id+'.jsonl';a.click();URL.revokeObjectURL(a.href)};downloadCase.onclick=()=>{const blob=new Blob([JSON.stringify(fixture,null,2)+'\n'],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fixture.id+'.json';a.click();URL.revokeObjectURL(a.href)};</script></html>
