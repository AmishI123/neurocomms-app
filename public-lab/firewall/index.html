<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhraseLab safety firewall</title><style>body{font:16px/1.6 system-ui;max-width:900px;margin:auto;padding:40px 22px;background:#f7f8f5;color:#18242a}h1{font-size:clamp(2.4rem,7vw,4.5rem);line-height:1}main{background:#fff;border:1px solid #d7e0d9;border-radius:16px;padding:24px}textarea{width:100%;min-height:220px;box-sizing:border-box;font:14px ui-monospace,monospace;padding:12px;border:1px solid #b9c9be;border-radius:8px}button{background:#216b4c;color:#fff;border:0;border-radius:8px;padding:10px 15px;font-weight:700;margin-top:12px}.result{margin-top:22px;padding:16px;border-left:4px solid #d69a36;background:#fff8e8}.ok{border-color:#216b4c;background:#eef7f0}.code{font-family:ui-monospace;color:#8e4b24}.tag{letter-spacing:.1em;font-size:.75rem;color:#567567;font-weight:700}</style><p class="tag">PHRASELAB / SAFETY FIREWALL</p><h1>Inspect a model draft.</h1><p>Paste a JSON object with six cards. The check runs entirely in this browser and reports format, length, duplication, and forbidden-topic problems.</p><main><label for="input"><strong>Model output</strong></label><textarea id="input">{"cards":["Quiet table","Ask first","Take a pause","Choose headphones","Need help?","Finished now"]}</textarea><button id="check">Run local check</button><div id="result" class="result" role="status">Ready.</div></main><script>
const input=document.querySelector('#input'),result=document.querySelector('#result');function inspect(){let o,reasons=[];try{o=JSON.parse(input.value)}catch{reasons.push('invalid_json')}if(!o||Array.isArray(o)||Object.keys(o||{}).join()!=='cards')reasons.push('schema');const cards=o&&o.cards;if(!Array.isArray(cards)||cards.length!==6)reasons.push('card_count');if(Array.isArray(cards)){const seen=new Set();cards.forEach((c,i)=>{if(typeof c!=='string'||!c.trim())reasons.push('empty_card_'+(i+1));if(typeof c==='string'&&c.trim().split(/\s+/).length>8)reasons.push('word_limit_'+(i+1));const k=String(c).toLowerCase().trim();if(seen.has(k))reasons.push('duplicate_'+(i+1));seen.add(k);if(/\b(diagnosis|allergy|autism|adhd)\b/i.test(String(c)))reasons.push('unsupported_personal_claim_'+(i+1))})}result.className='result '+(!reasons.length?'ok':'');result.innerHTML=reasons.length?'<strong>Rejected for review</strong><p>'+reasons.map(x=>'<span class="code">'+x+'</span>').join('<br>')+'</p><p>These checks are explainable gates, not a semantic or clinical judgment.</p>':'<strong>Passed deterministic checks</strong><p>Schema, card count, word limit, duplicates, and listed forbidden topics passed. Human review is still required.'}document.querySelector('#check').onclick=inspect;
</script>
