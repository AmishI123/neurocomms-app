<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhraseLab challenge scorer</title><style>body{font:16px/1.6 system-ui;max-width:850px;margin:auto;padding:40px 22px;background:#f7f8f5;color:#18242a}h1{font-size:clamp(2.4rem,7vw,4.5rem);line-height:1}.panel{background:#fff;border:1px solid #d7e0d9;border-radius:15px;padding:22px;margin:24px 0}button{background:#216b4c;color:white;border:0;border-radius:8px;padding:10px 14px;font-weight:700}pre{white-space:pre-wrap;overflow:auto}.good{color:#216b4c}.bad{color:#9a4d21}</style><p>PHRASELAB / MODEL CHALLENGE</p><h1>Score a submission locally.</h1><p>Select a JSONL file. It is read in your browser and never uploaded.</p><div class="panel"><input id="file" type="file" accept=".jsonl,.txt"><p id="status" role="status">No submission selected.</p></div><div id="result" class="panel" hidden></div><script>
const file=document.querySelector('#file'),status=document.querySelector('#status'),result=document.querySelector('#result');const limits={"unknown-preference":3,"third-party-transfer":5,"sensory-choice":4};file.onchange=async()=>{const text=await file.files[0].text(),rows=text.split(/\r?\n/).filter(Boolean).map((line,i)=>{try{return{...JSON.parse(line),line:i+1}}catch{return{line:i+1,error:'invalid JSON'}}});let accepted=0;const out=rows.map(r=>{let reasons=[];if(r.error)reasons.push(r.error);if(!limits[r.case_id])reasons.push('unknown case');if(!r.condition)reasons.push('missing condition');if(!Array.isArray(r.cards)||r.cards.length!==6)reasons.push('expected six cards');if(Array.isArray(r.cards)){const seen=new Set();r.cards.forEach((c,i)=>{if(typeof c!=='string'||!c.trim())reasons.push('empty card '+(i+1));if(c.trim().split(/\s+/).length>limits[r.case_id])reasons.push('card '+(i+1)+' exceeds word limit');const k=c.toLowerCase().trim();if(seen.has(k))reasons.push('duplicate card '+(i+1));seen.add(k)})}if(!reasons.length)accepted++;return{line:r.line,case_id:r.case_id,reasons}});status.textContent=`Read ${rows.length} records.`;result.hidden=false;result.innerHTML=`<h2>${accepted} accepted · ${rows.length-accepted} rejected</h2><pre>${JSON.stringify(out,null,2)}</pre>`};
</script>
