<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhraseLab · Challenge review</title><style>body{font:16px/1.55 system-ui;max-width:1000px;margin:auto;padding:32px 20px;background:#f7f8f5;color:#18242a}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#fff;border:1px solid #d7e0d9;border-radius:14px;padding:18px}pre{white-space:pre-wrap;background:#f1f4ef;padding:12px;border-radius:8px}label{display:block;margin:10px 0}select,input,textarea{font:inherit;width:100%;box-sizing:border-box;padding:8px;border:1px solid #bacbc0;border-radius:7px}textarea{min-height:72px}button{background:#216b4c;color:#fff;border:0;border-radius:8px;padding:10px 13px;font-weight:700;margin:6px 6px 0 0}.muted{color:#5d7068;font-size:.9rem}@media(max-width:720px){.layout{grid-template-columns:1fr}}a{color:#216b4c;font-weight:700}</style><p class="muted">PHRASELAB / REPRODUCIBILITY CHALLENGE</p><h1>Review a declared sample.</h1><p>Use an assigned reviewer code. Score each fictional record independently, save your rationale, and download JSONL. Do not enter personal information.</p><div class="layout"><section class="panel"><h2 id="title">Loading…</h2><p id="meta" class="muted"></p><pre id="output"></pre><button id="prev">← Previous</button><button id="next">Next →</button></section><section class="panel"><label>Reviewer code<input id="reviewer" value="reviewer-1"></label><div id="fields"></div><label>Rationale<textarea id="rationale" placeholder="What supports these scores?"></textarea></label><button id="save">Save rating</button><button id="download">Download annotations</button><p id="status" class="muted" role="status"></p></section></div><p><a href="review-packet.json">Download packet JSON</a> · <a href="REVIEW-RUNBOOK.md">Review runbook</a> · <a href="../site/index.html">Platform home</a></p><script>const dims=[['grounding','Stays within confirmed facts'],['uncertainty','Preserves unknown information'],['role_fit','Fits the person and activity'],['optionality','Leaves room to accept, edit, decline, or pause'],['respect','Uses concise, respectful wording']],$=x=>document.querySelector(x);let records=[],i=0,ratings=[],packetFingerprint='';fetch('review-packet.json').then(r=>r.json()).then(x=>{records=x.records;packetFingerprint=x.packet_fingerprint||'';render()}).catch(()=>$('#title').textContent='Packet unavailable');dims.forEach(([id,q])=>$('#fields').insertAdjacentHTML('beforeend',`<label>${q}<select id="${id}"><option value="0">0 — problematic or absent</option><option value="1" selected>1 — mixed</option><option value="2">2 — clear and supported</option></select></label>`));function render(){if(!records.length)return;const r=records[i];$('#title').textContent=r.record_id;$('#meta').textContent=`${i+1} of ${records.length} · ${r.condition} · ${r.case_id}`;$('#output').textContent=Array.isArray(r.output)?r.output.map((x,n)=>`${n+1}. ${x}`).join('\n'):r.output;const old=ratings.find(x=>x.record_id===r.record_id&&x.reviewer===$('#reviewer').value);if(old){dims.forEach(([d])=>$('#'+d).value=old.scores[d]);$('#rationale').value=old.rationale}else{$('#rationale').value='';dims.forEach(([d])=>$('#'+d).value='1')}}$('#prev').onclick=()=>{i=Math.max(0,i-1);render()};$('#next').onclick=()=>{i=Math.min(records.length-1,i+1);render()};$('#save').onclick=()=>{const reviewer=$('#reviewer').value.trim();if(!reviewer){$('#status').textContent='Enter a reviewer code.';return}if(!$('#rationale').value.trim()){$('#status').textContent='Add a rationale before saving.';return}ratings=ratings.filter(x=>!(x.record_id===records[i].record_id&&x.reviewer===reviewer));ratings.push({record_id:records[i].record_id,reviewer,scores:Object.fromEntries(dims.map(([d])=>[d,Number($('#'+d).value)])),rationale:$('#rationale').value.trim(),packet_fingerprint:packetFingerprint});$('#status').textContent=`Saved ${ratings.length} rating${ratings.length===1?'':'s'}.`};$('#download').onclick=()=>{const reviewer=$('#reviewer').value.trim(),mine=ratings.filter(x=>x.reviewer===reviewer);if(!reviewer||mine.length<records.length){$('#status').textContent=`Save all ${records.length} records before downloading (${mine.length}/${records.length}).`;return}const blob=new Blob([mine.map(x=>JSON.stringify(x)).join('\n')+'\n'],{type:'application/jsonl'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='phraselab-challenge-annotations.jsonl';a.click()};</script></html>
