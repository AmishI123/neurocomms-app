<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhraseLab failure museum</title><style>body{font:16px/1.6 system-ui;max-width:900px;margin:auto;padding:40px 22px;background:#f7f8f5;color:#18242a}h1{font-size:clamp(2.5rem,7vw,5rem);line-height:1;margin:12px 0 24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{background:#fff;border:1px solid #d8e0da;border-radius:15px;padding:22px}.tag{font-size:.75rem;letter-spacing:.1em;color:#9a5a22;font-weight:700}button{border:0;border-radius:8px;background:#216b4c;color:#fff;padding:9px 13px;font-weight:700;cursor:pointer}#detail{margin-top:24px;padding:20px;background:#fff8e8;border-left:4px solid #d69a36;min-height:55px}</style><p class="tag">PHRASELAB / FAILURE MUSEUM</p><h1>What can go wrong?</h1><p>These fictional examples make model and interface failures inspectable. Select a card to see the lesson behind it.</p><div id="cards" class="grid"></div><div id="detail" role="status">Choose a failure above.</div><script>
const failures=[{"id":"third-party-transfer","title":"A friend’s preference became the user’s preference","lesson":"Grounding requires tracking whose fact is whose."},{"id":"review-no-repair","title":"A review prompt repeated the draft","lesson":"A second pass is not evidence of correction unless the output changes in a measurable way."},{"id":"format-success-semantic-failure","title":"Valid JSON can still be a poor suggestion","lesson":"Schema validation is necessary but not sufficient."}];const cards=document.querySelector('#cards'),detail=document.querySelector('#detail');failures.forEach(f=>{const a=document.createElement('article');a.className='card';a.innerHTML='<p class="tag">'+f.id+'</p><h2>'+f.title+'</h2><button>Inspect lesson</button>';a.querySelector('button').onclick=()=>{detail.textContent='';const h=document.createElement('strong');h.textContent=f.title;const p=document.createElement('p');p.textContent=f.lesson;detail.append(h,p)};cards.append(a)});
</script><section id="evidence" style="margin-top:30px"><h2>Evidence-linked records</h2><p>These excerpts come from the fictional v3 benchmark and are truncated for display.</p><div id="records" class="grid"></div></section><script>fetch('catalog.json').then(r=>r.json()).then(data=>{const root=document.querySelector('#records');data.records.forEach(x=>{const a=document.createElement('article');a.className='card';const h=document.createElement('h3');h.textContent=x.id;const p=document.createElement('p');p.textContent=x.failure;const pre=document.createElement('pre');pre.textContent=x.output;pre.hidden=true;const b=document.createElement('button');b.textContent='Show output';b.onclick=()=>{pre.hidden=!pre.hidden;b.textContent=pre.hidden?'Show output':'Hide output'};a.append(h,p,b,pre);root.append(a)})}).catch(()=>{});</script>
