<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Helper Jobs · Present</title><style>
:root{--bg:#1F1915;--ink:#F3ECE1;--muted:#CDBFA9;--rust:#E3B98F;--bar:rgba(31,25,21,.92)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:500 16px/1.4 system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden}
.stage{position:fixed;inset:0 0 56px 0;display:flex;align-items:center;justify-content:center;padding:12px}
.stage img{max-width:100%;max-height:100%;object-fit:contain;display:block;box-shadow:0 8px 40px rgba(0,0,0,.45);user-select:none;-webkit-user-drag:none}
body.full .stage{inset:0;padding:0}body.full .stage img{box-shadow:none}
.bar{position:fixed;left:0;right:0;bottom:0;height:56px;background:var(--bar);display:flex;align-items:center;gap:8px;padding:0 12px;transition:opacity .25s}
body.full .bar{opacity:0}body.full.show-bar .bar{opacity:1}
.bar button,.bar a{min-height:44px;min-width:44px;padding:0 14px;border:1px solid #5A4A3E;background:transparent;color:var(--ink);font:inherit;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.bar button:hover,.bar a:hover{border-color:var(--rust)}
:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
.count{min-width:72px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.spacer{flex:1}
.notes{position:fixed;left:0;right:0;bottom:56px;max-height:34vh;overflow:auto;background:#2B231D;border-top:2px solid var(--rust);padding:14px 20px;font:400 18px/1.5 Georgia,serif;display:none}
body.notes-on .notes{display:block}body.notes-on .stage{bottom:calc(56px + 34vh)}
body.full .notes{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hint{color:var(--muted);font-size:13px}
.bar button,.bar a{white-space:nowrap}.short{display:none}
.bar a .label{display:inline}
@media (max-width:640px){.hint,.label,.bar a .label,#notes-toggle{display:none}.short{display:inline}.count{min-width:52px}.bar button,.bar a{padding:0 8px}.bar{gap:4px}.bar{gap:6px;padding:0 8px}.bar button,.bar a{padding:0 10px}}
</style></head><body>
<main class="stage" aria-label="Slides"><img id="view" src="slides/01-cover.jpg" alt="Cover: Give someone a job they can be proud of. A volunteer is always close by. Four cards: who are you, pick a job, one step at a time, done."></main>

<p class="sr" id="live" aria-live="polite"></p>
<nav class="bar" aria-label="Slide controls">

<span class="spacer"></span><span class="hint">Arrow keys or tap to move · F for full screen · N for presenter view</span>
<button type="button" id="notes-toggle" title="Presenter view with notes, next slide and a timer, in a separate window (N)">Presenter view</button><a href="helper-jobs-slides.pdf" download title="Download PDF"><span class="label">PDF</span><span class="sr"> download</span>⤓</a>
<button type="button" id="full" title="Full screen (F)" aria-label="Full screen"><span class="label" id="full-label">Full screen</span><span class="short" id="full-short" aria-hidden="true">⛶</span></button>
</nav>
<script>var ITEMS=[{"src": "slides/01-cover.jpg", "alt": "Cover: Give someone a job they can be proud of. A volunteer is always close by. Four cards: who are you, pick a job, one step at a time, done.", "notes": "Say: Helper Jobs gives Pragnya adults a real job at kids\u2019 Sunday outings. Pick your picture, pick a job, follow one picture step at a time, and a volunteer is always close by. Everyone in these slides is made up."}, {"src": "slides/02-story.jpg", "alt": "Left, today: Asha is told to help out and waits at the side. Right, with Helper Jobs: she taps her picture, does Snack Helper with Eli and a volunteer nearby, follows one step at a time, and picks a smiley.", "notes": "Say: Asha is made up. On the left, today: she is told to help out, waits at the side, and is handed snacks with no word about allergies. On the right, with Helper Jobs: she taps her picture, the lead has matched her with Eli and a volunteer nearby, she follows one picture step at a time, and finishes with a smiley and a star."}, {"src": "slides/03-problem.jpg", "alt": "Four cards: having a real role, following the steps, keeping kids safe, getting help, each with what Helper Jobs does about it.", "notes": "Say each one in a sentence: no clear job, instructions that come too fast, the lead juggling safety, and needing help quickly. The hard part is the moment, never the person. These come from volunteering at the outings; we have not studied them yet."}, {"src": "slides/04-roles.jpg", "alt": "Three roles joined by arrows: coordinator keeps the records and approves jobs, volunteer lead runs the day and sets up each job, helper does a real job. A band: helpers are never alone with a kid.", "notes": "Say: there are three roles on one shared tablet. The coordinator keeps the records and approves new jobs. The lead runs the day: who is here, who does which job with which kid, and a named volunteer nearby. The helper taps their picture and does a real job. Kids never use the app."}, {"src": "slides/05-journey.jpg", "alt": "Four phone screens: who are you today with three pictures; pick a job with Snack Helper set up with Eli; one step, pick up trash; job complete with Happy, Okay and Hard.", "notes": "Demo: I\u2019m a helper, tap Asha, pick Clean-Up Crew, read a step aloud, Next to the end, tap Happy. Say: no login, one picture step per screen, big buttons, and a star for every finished job."}, {"src": "slides/06-jobs.jpg", "alt": "Three levels of jobs: Level 1 Snack Helper, Walk Leader, Clean-Up Crew; Level 2 Play Partner, Talk Friend; Level 3 Buddy. Five snack jobs earn a Snack Star badge.", "notes": "Say: there are six jobs in three levels. Everyone starts with Snack Helper, Walk Leader and Clean-Up Crew. Play Partner and Talk Friend come next, and Buddy last. The app never moves anyone up by itself: only the coordinator approves a new job. Badges are counted from finished jobs, not typed in."}, {"src": "slides/07-safety.jpg", "alt": "Four safety rules beside two phone screens: a no-snack card for Noor turning the job into no-snack steps, and an assignment that cannot be saved without a nearby volunteer.", "notes": "Say: safety is built into the screens. A kid job needs a named volunteer nearby before it can start. A no-snack card changes the job itself, and read aloud says it first. Helpers never give bathroom help, and never chase. Stopping is always okay. Demo: show Noor\u2019s no-snack card."}, {"src": "slides/08-help.jpg", "alt": "A helper screen with the Help button, an arrow, and the lead\u2019s phone showing Asha needs you with an I\u2019m here button.", "notes": "Demo: pair my phone from the live board, then tap Help on a job. My phone shows Asha needs you within a second; I tap I\u2019m here and it closes on the tablet. Say: everything is locked on the tablet before it is sent, so the server cannot read names. Without internet, it still shows on the tablet\u2019s board."}, {"src": "slides/09-lead.jpg", "alt": "Four lead steps beside two phone screens: who is here today with tick boxes, and make a safe match with helper, kid, job and nearby volunteer.", "notes": "Demo: I\u2019m the volunteer lead, choose a PIN, tick who is here, Start live board, Make assignment: Asha, Snack Helper, Eli, Jordan nearby. Say: it will not save a kid job without a named volunteer nearby. Then Lead\u2019s phone: scan the code with my phone."}, {"src": "slides/10-day.jpg", "alt": "Four things the board does on the day beside three phone screens: a break reminder for Mina, the day plan with now and next, and the head count with Eli back and Noor home with family.", "notes": "Demo: on the live board, Mina has been on Clean-Up for 20 minutes, so the board says offer a break. Answer Asha\u2019s Help with I\u2019m here, and type one line for the coordinator. Then Wrap up: it will not finish until every kid is marked back with a volunteer or home with family. Show the day plan: the helper\u2019s screen says what is happening now and next, and the lead taps Next part when the group moves on."}, {"src": "slides/11-helpers.jpg", "alt": "Four phone screens: Ravi\u2019s jobs in Hindi, a step read aloud in Hindi, practice runs for Play Partner and Talk Friend, and the Talk Friend 10-second circle. A band: three languages, bigger text, stronger contrast, slower read aloud, practice without a kid.", "notes": "Say: the coordinator sets each helper\u2019s language, text size, contrast and voice speed. Ravi reads and hears his steps in Hindi. Before a coordinator unlocks a level 2 job, a helper can try a practice run with no kid; the coordinator sees it. Talk Friend\u2019s wait is a circle that fills slowly. The Hindi and Spanish are first drafts: a native speaker checks them before a real outing."}, {"src": "slides/12-devices.jpg", "alt": "A diagram: the main tablet in the middle, joined by dotted, locked lines to the lead\u2019s phone, a second helper tablet, the coordinator\u2019s laptop backup and a family page.", "notes": "Say: the main tablet is still the one place the records live. It can share with the lead\u2019s phone, a second helper tablet, the coordinator\u2019s laptop and a family page. Each gets only what it needs, and everything is locked on the tablet before it leaves. Demo: More tablets, scan the code with a second tablet, and press Help on it."}, {"src": "slides/13-families.jpg", "alt": "Three rules about photos and family pages beside two phone screens, a coordinator adding a photo after a yes and Asha\u2019s family page, and a printed Snack Star certificate.", "notes": "Say: the coordinator ticks a yes before any photo can be added, and unticking it deletes the photo. Photos stay on the main tablet. A family can get a page for their own helper only: stars, badges, certificates and the lead\u2019s note, never other people or Help notes. Certificates print from the tablet or the family page."}, {"src": "slides/14-fails.jpg", "alt": "Three cards: paper job cards for when the tablet stops, a paper match sheet and head count, and a locked copy on the coordinator\u2019s laptop that restores on any tablet.", "notes": "Say: nothing about safety depends on the tablet, because a volunteer is always next to a helper with a kid. If the tablet stops, the lead hands out paper job cards and writes matches on the paper sheet. If it breaks, the coordinator\u2019s laptop has the newest locked copy, which restores on another tablet."}, {"src": "slides/15-ready.jpg", "alt": "Four cards: the lead\u2019s phone buzzes even when locked, two minutes of feedback after the outing, helpers stay in the app with a setup guide, and a native speaker checks the Hindi and Spanish.", "notes": "Say: four things are about the real day, not the demo. The lead\u2019s phone buzzes even when locked, and the alert has no names in it. After the outing, volunteers and the lead leave a face and a few words. The tablet can be kept in helper-only mode, with a printed setup guide. And a native speaker checks every Hindi and Spanish line before we use them."}, {"src": "slides/16-coord.jpg", "alt": "Three cards: making a new job called Zoo Guide with picture steps, the progress page with jobs per Sunday and a might-be-ready hint, and a step with a real photo of the place. A band: a date on every yes, asked again after a year, download what we hold, recovery words for a lost PIN.", "notes": "Say: the coordinator can make a new job without a developer, for example Zoo Guide, with picture steps. It starts locked. The progress page shows each helper\u2019s jobs across Sundays. \u201cMight be ready\u201d is only a hint from the records; the coordinator decides with the helper and the lead. Every yes has a date and is asked again after a year. Anyone can get a copy of what we hold about them."}, {"src": "slides/17-measure.jpg", "alt": "Four things the report counts beside a laptop showing the Sunday report: tiles for helpers, jobs done, help asked, typical time to I\u2019m here, and happy, okay, hard; bars for jobs done and for how fast someone came.", "notes": "Say: after each Sunday the coordinator opens one page. It is made from what happened on the tablet: who had a job, how many jobs, how fast someone came after Help, how each job felt, breaks, practice runs, and what volunteers and the lead wrote in the two-minute feedback. After three Sundays we compare the three pages. These numbers are made up."}, {"src": "slides/18-privacy.jpg", "alt": "Three columns: what the helper sees (first name, picture letter, three tips, the snack colour), what only the coordinator sees (allergies, consent, levels, history), and what stays on the tablet (no accounts, scrambled PINs, nothing sent).", "notes": "Say: helpers see a first name, a picture letter and up to three tips. Allergies, consent and levels are for the coordinator only. Records stay on the tablet. If the lead pairs a phone, only first names, jobs and alerts go to it, locked on the tablet first, and old records clear after the days the coordinator sets."}, {"src": "slides/19-notyet.jpg", "alt": "Six dashed boxes of open questions, each with an icon: a real Sunday, patchy internet, a busy park, Hindi and Spanish wording, consent forms, who looks after the records.", "notes": "Say: we don\u2019t know yet whether it helps on a real Sunday. Linked devices need internet, and we have not tried them in a busy park. The Hindi and Spanish need a native speaker, and the consent forms need new questions for photos and family pages. Those are the next steps, not claims."}, {"src": "slides/20-ask.jpg", "alt": "Three asks: three outings, one lead and one coordinator, tell us what changed. A QR code to helper-jobs.onrender.com.", "notes": "Ask for three things: three outings with three to five helpers, one lead and one coordinator, and honest feedback about what changed. Then take questions. The QR code opens the app."}];var KIND="Slide";
(function(){
  var items = ITEMS, i = 0, kind = KIND;
  var img = document.getElementById('view'), count = document.getElementById('count'), live = document.getElementById('live'), notes = document.getElementById('notes');
  var m = /[#&]?(\d+)$/.exec(location.hash); if (m) i = Math.min(items.length - 1, Math.max(0, +m[1] - 1));
  // Load the neighbours early so moving between pages is instant.
  items.forEach(function(item){ var pre = new Image(); pre.src = item.src; });
  // The presenter window and this one stay on the same slide.
  var channel = ('BroadcastChannel' in window) ? new BroadcastChannel('helper-jobs-present') : null, quiet = false;
  if (channel) channel.onmessage = function(e){ if (e.data && typeof e.data.slide === 'number' && e.data.slide !== i) { quiet = true; show(e.data.slide); quiet = false; } if (e.data && e.data.hello) channel.postMessage({slide: i}); };
  function show(n){
    i = Math.min(items.length - 1, Math.max(0, n));
    img.src = items[i].src; img.alt = items[i].alt;
    count.textContent = (i + 1) + ' / ' + items.length;
    live.textContent = kind + ' ' + (i + 1) + ' of ' + items.length + '. ' + items[i].alt;
    history.replaceState(null, '', '#' + (i + 1));
    if (channel && !quiet) channel.postMessage({slide: i});
    document.getElementById('prev').disabled = i === 0; document.getElementById('next').disabled = i === items.length - 1;
  }
  function full(){
    var el = document.documentElement;
    if (!document.fullscreenElement) { (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el); }
    else { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
  }
  document.addEventListener('fullscreenchange', function(){ document.body.classList.toggle('full', !!document.fullscreenElement); var on = !!document.fullscreenElement; document.getElementById('full-label').textContent = on ? 'Exit full screen' : 'Full screen'; document.getElementById('full-short').textContent = on ? '✕' : '⛶'; document.getElementById('full').setAttribute('aria-label', on ? 'Exit full screen' : 'Full screen'); });
  document.getElementById('prev').onclick = function(){ show(i - 1); };
  document.getElementById('next').onclick = function(){ show(i + 1); };
  document.getElementById('full').onclick = full;
  // Speaker notes open in their own window, for the laptop screen, so they never show on the projector.
  var notesBtn = document.getElementById('notes-toggle');
  if (notesBtn) notesBtn.onclick = function(){ window.open('presenter.html#' + (i + 1), 'helper-jobs-presenter', 'width=1280,height=800'); };
  document.addEventListener('keydown', function(e){
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var k = e.key;
    // Space and Enter on a focused button press that button; they never also move the slides.
    if ((k === ' ' || k === 'Enter') && e.target && e.target.closest && e.target.closest('button, a')) return;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter') { e.preventDefault(); show(i + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); show(i - 1); }
    else if (k === 'Home') { e.preventDefault(); show(0); }
    else if (k === 'End') { e.preventDefault(); show(items.length - 1); }
    else if (k === 'f' || k === 'F') { full(); }
    else if ((k === 'n' || k === 'N') && notesBtn) { notesBtn.click(); }
  });
  // Click the right two thirds to go forward, the left third to go back. Swipe on phones.
  document.querySelector('.stage').addEventListener('click', function(e){ if (e.clientX < innerWidth / 3) show(i - 1); else show(i + 1); });
  var x0 = null; document.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive: true});
  document.addEventListener('touchend', function(e){ if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) show(i + (dx < 0 ? 1 : -1)); x0 = null; });
  // In full screen the bar hides; moving the mouse brings it back for a moment.
  var t = null; document.addEventListener('mousemove', function(){ document.body.classList.add('show-bar'); clearTimeout(t); t = setTimeout(function(){ document.body.classList.remove('show-bar'); }, 1800); });
  window.addEventListener('hashchange', function(){ var h = /#([0-9]+)$/.exec(location.hash); if (h && +h[1] - 1 !== i) show(+h[1] - 1); });
  show(i);
})();
</script>
</body></html>
