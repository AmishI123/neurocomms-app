rds: having a real role, following the steps, keeping kids safe, getting help, each with what Helper Jobs does about it.</figcaption></figure><figure id="s4"><a href="present.html#4" class="slide-link"><img src="slides/04-roles.jpg" alt="Slide 4: Three roles joined by arrows: coordinator keeps the records and approves jobs, volunteer lead runs the day and sets up each job, helper does a real job. A band: helpers are never alone with a kid." loading="lazy" width="1920" height="1080"></a><figcaption>4 / 20 · Three roles joined by arrows: coordinator keeps the records and approves jobs, volunteer lead runs the day and sets up each job, helper does a real job. A band: helpers are never alone with a kid.</figcaption></figure><figure id="s5"><a href="present.html#5" class="slide-link"><img src="slides/05-journey.jpg" alt="Slide 5: Four phone screens: who are you today with three pictures; pick a job with Snack Helper set up with Eli; one step, pick up trash; job complete with Happy, Okay and Hard." loading="lazy" width="1920" height="1080"></a><figcaption>5 / 20 · Four phone screens: who are you today with three pictures; pick a job with Snack Helper set up with Eli; one step, pick up trash; job complete with Happy, Okay and Hard.</figcaption></figure><figure id="s6"><a href="present.html#6" class="slide-link"><img src="slides/06-jobs.jpg" alt="Slide 6: Three levels of jobs: Level 1 Snack Helper, Walk Leader, Clean-Up Crew; Level 2 Play Partner, Talk Friend; Level 3 Buddy. Five snack jobs earn a Snack Star badge." loading="lazy" width="1920" height="1080"></a><figcaption>6 / 20 · Three levels of jobs: Level 1 Snack Helper, Walk Leader, Clean-Up Crew; Level 2 Play Partner, Talk Friend; Level 3 Buddy. Five snack jobs earn a Snack Star badge.</figcaption></figure><figure id="s7"><a href="present.html#7" class="slide-link"><img src="slides/07-safety.jpg" alt="Slide 7: Four safety rules beside two phone screens: a no-snack card for Noor turning the job into no-snack steps, and  Partner and Talk Friend, and the Talk Friend 10-second circle. A band: three languages, bigger text, stronger contrast, slower read aloud, practice without a kid." loading="lazy" width="1920" height="1080"></a><figcaption>11 / 20 · Four phone screens: Ravi’s jobs in Hindi, a step read aloud in Hindi, practice runs for Play Partner and Talk Friend, and the Talk Friend 10-second circle. A band: three languages, bigger text, stronger contrast, slower read aloud, practice without a kid.</figcaption></figure><figure id="s12"><a href="present.html#12" class="slide-link"><img src="slides/12-devices.jpg" alt="Slide 12: A diagram: the main tablet in the middle, joined by dotted, locked lines to the lead’s phone, a second helper tablet, the coordinator’s laptop backup and a family page." loading="lazy" width="1920" height="1080"></a><figcaption>12 / 20 · A diagram: the main tablet in the middle, joined by dotted, locked lines to the lead’s phone, a second helper tablet, the coordinator’s laptop backup and a family page.</figcaption></figure><figure id="s13"><a href="present.html#13" class="slide-link"><img src="slides/13-families.jpg" alt="Slide 13: Three rules about photos and family pages beside two phone screens, a coordinator adding a photo after a yes and Asha’s family page, and a printed Snack Star certificate." loading="lazy" width="1920" height="1080"></a><figcaption>13 / 20 · Three rules about photos and family pages beside two phone screens, a coordinator adding a photo after a yes and Asha’s family page, and a printed Snack Star certificate.</figcaption></figure><figure id="s14"><a href="present.html#14" class="slide-link"><img src="slides/14-fails.jpg" alt="Slide 14: Three cards: paper job cards for when the tablet stops, a paper match sheet and head count, and a locked copy on the coordinator’s laptop that restores on any tablet." loading="lazy" width="1920" height="1080"></a><figcaption>14 / 20 · Three cards: paper job cards for when the tablet stops, a paper match sheet and head count, and a locked copy on the coordinator’s laptop that restores on any tablet.</figcaption></figure><figure id="s15"><a href="present.html#15" class="slide-link"><img src="slides/15-ready.jpg" alt="Slide 15: Four cards: the lead’s phone buzzes even when locked, two minutes of feedback after the outing, helpers stay in the app with a setup guide, and a native speaker checks the Hindi and Spanish." loading="lazy" width="1920" height="1080"></a><figcaption>15 / 20 · Four cards: the lead’s phone buzzes even when locked, two minutes of feedback after the outing, helpers stay in the app with a setup guide, and a native speaker checks the Hindi and Spanish.</figcaption></figure><figure id="s16"><a href="present.html#16" class="slide-link"><img src="slides/16-coord.jpg" alt="Slide 16: Three cards: making a new job called Zoo Guide with picture steps, the progress page with jobs per Sunday and a might-be-ready hint, and a step with a real photo of the place. A band: a date on every yes, asked again after a year, download what we hold, recovery words for a lost PIN." loading="lazy" width="1920" height="1080"></a><figcaption>16 / 20 · Three cards: making a new job called Zoo Guide with picture steps, the progress page with jobs per Sunday and a might-be-ready hint, and a step with a real photo of the place. A band: a date on every yes, asked again after a year, download what we hold, recovery words for a lost PIN.</figcaption></figure><figure id="s17"><a href="present.html#17" class="slide-link"><img src="slides/17-measure.jpg" alt="Slide 17: Four things the report counts beside a laptop showing the Sunday report: tiles for helpers, jobs done, help asked, typical time to I’m here, and happy, okay, hard; bars for jobs done and for how fast someone came." loading="lazy" width="1920" height="1080"></a><figcaption>17 / 20 · Four things the report counts beside a laptop showing the Sunday report: tiles for helpers, jobs done, help asked, typical time to I’m here, and happy, okay, hard; bars for jobs done and for how fast someone came.</figcaption></figure><figure id="s18"><a href="present.html#18" class="slide-link"><img src="slides/18-privacy.jpg" alt="Slide 18: Three columns: what the helper sees (first name, picture letter, three tips, the snack colour), what only the coordinator sees (allergies, consent, levels, history), and what stays on the tablet (no accounts, scrambled PINs, nothing sent)." loading="lazy" width="1920" height="1080"></a><figcaption>18 / 20 · Three columns: what the helper sees (first name, picture letter, three tips, the snack colour), what only the coordinator sees (allergies, consent, levels, history), and what stays on the tablet (no accounts, scrambled PINs, nothing sent).</figcaption></figure><figure id="s19"><a href="present.html#19" class="slide-link"><img src="slides/19-notyet.jpg" alt="Slide 19: Six dashed boxes of open questions, each with an icon: a real Sunday, patchy internet, a busy park, Hindi and Spanish wording, consent forms, who looks after the records." loading="lazy" width="1920" height="1080"></a><figcaption>19 / 20 · Six dashed boxes of open questions, each with an icon: a real Sunday, patchy internet, a busy park, Hindi and Spanish wording, consent forms, who looks after the records.</figcaption></figure><figure id="s20"><a href="present.html#20" class="slide-link"><img src="slides/20-ask.jpg" alt="Slide 20: Three asks: three outings, one lead and one coordinator, tell us what changed. A QR code to helper-jobs.onrender.com." loading="lazy" width="1920" height="1080"></a><figcaption>20 / 20 · Three asks: three outings, one lead and one coordinator, tell us what changed. A QR code to helper-jobs.onrender.com.</figcaption></figure></main><footer class="foot">An early test version for Pragnya Sunday outings. Every person and example is made up. It does not diagnose anything. · <a href="../">Open the app</a></footer></div></body></html>
