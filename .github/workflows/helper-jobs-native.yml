name: Helper Jobs Android and iPad apps

# Builds the Helper Jobs app shells from the same pages as the website, runs the real Android app on an
# emulator and the iPad app on a simulator, and publishes the APKs and screenshots to the
# helper-jobs-native-builds branch.
on:
  push:
    branches: [main]
    paths:
      - 'helper-jobs/*.html'
      - 'helper-jobs/*.js'
      - 'helper-jobs/*.css'
      - 'helper-jobs/vendor/**'
      - 'helper-jobs/native/**'
      - '.github/workflows/helper-jobs-native.yml'
  workflow_dispatch:
    inputs:
      ios:
        description: Also build the iPad app
        type: boolean
        default: true

concurrency:
  group: helper-jobs-native
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    # Ubuntu 24.04 runners come with the Android SDK; the newer image may not.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: helper-jobs/native
    env:
      HELPER_JOBS_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: helper-jobs/native/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Check the Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms" || { echo "::error::No Android SDK on this runner"; exit 1; }
          echo "::notice::Android SDK platforms: $(ls $ANDROID_HOME/platforms | tr '\n' ' ')"
      - run: npm ci
      - name: Copy the web app in and sync Capacitor
        run: |
          npm run build
          npx cap sync android
          node scripts/check-shells.mjs
      - name: Use the release key when the repository has one
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.HELPER_JOBS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/helper-jobs.jks"
            echo "HELPER_JOBS_KEYSTORE=$RUNNER_TEMP/helper-jobs.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the debug and release APKs
        working-directory: helper-jobs/native/android
        env:
          HELPER_JOBS_KEYSTORE_PASSWORD: ${{ secrets.HELPER_JOBS_KEYSTORE_PASSWORD }}
          HELPER_JOBS_KEY_ALIAS: ${{ secrets.HELPER_JOBS_KEY_ALIAS }}
          HELPER_JOBS_KEY_PASSWORD: ${{ secrets.HELPER_JOBS_KEY_PASSWORD }}
        run: |
          set -o pipefail
          mkdir -p ../../../_out/android
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace 2>&1 | tee ../../../_out/android/gradle.log || { grep -E -m8 "error:|What went wrong|FAILURE|> " ../../../_out/android/gradle.log | sed 's/^/::error::/'; exit 1; }
      - name: Collect the APKs
        run: |
          mkdir -p ../../_out/android
          cp android/app/build/outputs/apk/debug/app-debug.apk ../../_out/android/helper-jobs-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk ../../_out/android/helper-jobs.apk
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk ../../_out/android/helper-jobs-release-unsigned.apk
          fi
          ls -la ../../_out/android
      - name: Let the emulator use hardware speed-up
        run: |
          if [ -e /dev/kvm ]; then echo "::notice::KVM is available on this runner"; else echo "::warning::No KVM on this runner: the emulator will be very slow"; fi
          nproc; free -g | head -2
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Make room on the runner for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" "$ANDROID_HOME/ndk" || true
          df -h / | tail -1
      - name: Start an Android tablet emulator
        run: scripts/emulator.sh 30 ../../_out/android/journey
      - name: Run the app on the emulator
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          node scripts/android-journey.mjs --serial=emulator-5554 --out=../../_out/android/journey
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helper-jobs-android
          path: _out/android

  ios:
    if: github.event_name != 'workflow_dispatch' || inputs.ios
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: helper-jobs/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: helper-jobs/native/package-lock.json
      - run: npm ci
      - name: Copy the web app in and sync Capacitor
        run: |
          npm run build
          npx cap sync ios
      - name: Build the iPad app for the simulator
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: Open it on an iPad simulator and take pictures
        run: |
          set -e
          mkdir -p ../../_out/ios
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; ids=[x['udid'] for r in sorted(d, reverse=True) if 'iOS' in r for x in d[r] if x['name'].startswith('iPad')]; print(ids[0])")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" ios/build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" org.helperjobs.app
          # Wait until the app's cream screen shows (the simulator can still be starting up).
          for i in $(seq 1 30); do
            sleep 6
            xcrun simctl io "$DEVICE" screenshot ../../_out/ios/01-ipad-home.png >/dev/null 2>&1 || continue
            sips -s format bmp ../../_out/ios/01-ipad-home.png --out "$RUNNER_TEMP/shot.bmp" >/dev/null 2>&1
            BRIGHT=$(python3 -c "import sys; d=open(sys.argv[1],'rb').read()[200000:]; print(sum(d[::97])//len(d[::97]))" "$RUNNER_TEMP/shot.bmp")
            if [ "$BRIGHT" -gt 120 ]; then echo "::notice::iPad app on screen after $((i*6)) s"; break; fi
            xcrun simctl launch "$DEVICE" org.helperjobs.app >/dev/null 2>&1 || true
          done
          if xcrun simctl spawn "$DEVICE" launchctl list | grep -q org.helperjobs.app; then echo "ios-app-running" | tee ../../_out/ios/status.txt; else echo "the app is not running" && exit 1; fi
          (cd ios/build/Build/Products/Debug-iphonesimulator && zip -qr ../../../../../../../_out/ios/helper-jobs-ipad-simulator.zip App.app)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helper-jobs-ios
          path: _out/ios

  publish:
    needs: [android, ios]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: builds
      - name: Publish to the helper-jobs-native-builds branch
        env:
          RESULT_ANDROID: ${{ needs.android.result }}
          RESULT_IOS: ${{ needs.ios.result }}
        run: |
          mkdir -p builds && cd builds
          rm -f helper-jobs-ios/helper-jobs-ipad-simulator.zip
          cat > README.md <<EOF
          # Helper Jobs app builds

          Built from ${GITHUB_SHA} (run ${GITHUB_RUN_NUMBER}). Android: ${RESULT_ANDROID}. iPad simulator: ${RESULT_IOS}.

          - helper-jobs-android/: the APKs and the emulator journey (screenshots and report.json)
          - helper-jobs-ios/: screenshots from the iPad simulator
          EOF
          git init -q -b helper-jobs-native-builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Helper Jobs app builds from ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER})"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" helper-jobs-native-builds
